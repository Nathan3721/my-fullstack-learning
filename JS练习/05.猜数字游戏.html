<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜数字游戏</title>
</head>
<body>
  <script>
 const answer = Math.floor(Math.random() * 100) + 1;  // 1-100随机数
  let guess;
  let count = 0;

  alert("我想了一个1-100的数字,猜猜是多少?");

  while (guess !== answer) {
    guess = Number(prompt("请输入你的猜测:"));
    count++;

    if (isNaN(guess)) {
      alert("请输入数字!");
      continue;
    }

    if (guess < answer) {
      alert("小了,再大点");
    } else if (guess > answer) {
      alert("大了,再小点");
    } else {
      alert(`恭喜!你猜了${count}次就对了!`);  
      break;
    }
  }
  </script>
</body>
</html>
