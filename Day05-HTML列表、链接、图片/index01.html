<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表</title>
</head>
<body>
  <!-- 无序列表 ul-->
  <!-- **重点**:`<ul>` 里只能放 `<li>`,`<li>` 里可以放任何内容 -->
    <ul>
      <li>苹果</li>
      <li>香蕉</li>
      <li>橙子</li>
    </ul>

  <!-- 有序列表 ol -->
  <!-- 
  **属性**:
  - `type="A"` 用大写字母编号
  - `start="5"` 从5开始编号
  - `reversed` 倒序编号
  -->
    <ol>
      <li>第一步：打开编辑器</li>
      <li>第二步：新建文件</li>
      <li>第三步：开始写代码</li>
    </ol>

    <!-- 定义列表 dl -->
    <!-- 用于名词解释、描述 -->
</body>
</html></html>
