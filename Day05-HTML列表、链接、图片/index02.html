<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接</title>
</head>
<body>
  <!-- 外部链接(必须加https://) -->
  <a href="https://www.baidu.com">百度</a>

  <!-- 新标签页打开 -->
  <a href="https://www.baidu.com" target="_blank">百度(新窗口)</a>

  <!-- 内部链接(同目录其他HTML文件) -->
  <a href="about.html">关于我</a>

  <!-- 锚点(同页面跳转) -->
  <a href="#section1">跳到第一部分</a>
  ...
  <section id="section1">这里是第一部分</section>

  <!-- 邮箱链接 -->
  <a href="mailto:zhangsan@example.com">发邮件</a>

  <!-- 电话链接 -->
  <a href="tel:13800138000">打电话</a>

  <!-- 
  **属性**:
  - `href` 链接地址(必填)
  - `target="_blank"` 在新标签页打开(常用)
  - `target="_self"` 当前页打开(默认) 
  -->
</body>
</html>
