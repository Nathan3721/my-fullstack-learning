<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语义化标签 HTML5新增</title>
</head>
<body>
  <!--
  语义化=用有意义的标签,而不是全用div:
  **为什么用语义化?**
1. SEO友好(搜索引擎更易理解)
2. 屏幕阅读器友好(盲人也能用)
3. 代码可读性强
  -->

<header>页头（网页顶部）</header>
<nav>导航（导航栏）</nav>
<main>主要内容区域</main>
<article>独立文章内容区域</article>
<aside>侧边栏</aside>
<footer>页脚（网页底部）</footer>
</body>
</html>
