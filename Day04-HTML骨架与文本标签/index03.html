<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>段落 换行 水平线</title>
</head>
<body>
  <!--
  **重点**:
- `<p>` 段落之间有上下间距
- `<br>` 换行没有间距
- `<hr>` 水平线 
-->

<p>这是一个段落。Pp标签会自动换行,段落之间有间距。</p>
<p>这是第二个段落。</p>

<p>这是一段话,<br>这里强制换行。br是单标签,不需要配对。</p>

<hr>
<p>上面是一条水平分割线。hr也是单标签。</p>

</body>
</html>
