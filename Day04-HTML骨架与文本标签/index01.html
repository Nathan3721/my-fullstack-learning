<!DOCTYPE html>
<!-- 告诉浏览器这是HTML5文档,必须有 -->
<html lang="zh-CN">
  <!-- 网页根标签,lang表示语言是中文 -->
<head>
  <!-- 头部,放看不见的配置信息 -->
  <meta charset="UTF-8">
  <!-- 字符编码用UTF-8,避免中文乱码(必加) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 移动端适配,让手机也能正常显示 -->
  <title>页面标题</title>
  <!-- 浏览器标签页上显示的标题 -->
</head>
<body>
  <!-- 主体内容 -->
  <h1>这是大标题</h1>
</body>
</html>
<!-- **避雷**: charset必须写成UTF-8,不写或写错中文会显示乱码 -->
