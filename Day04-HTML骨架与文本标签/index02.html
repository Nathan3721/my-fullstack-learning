<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标题标签 h1-h6</title>
</head>
<body>
  <!-- **重点(★★★★★)**:
  - 一个页面 `<h1>` 最好只用一次,放最重要的标题(对SEO友好)
  - 标题用于"内容层级",不要为了"字大"用标题 -->

  <h1>一级标题（最大，页面主标题，只能有一个）</h1>
  <h2>二级标题（常用）</h2>
  <h3>三级标题（常用）</h3>
  <h4>四级标题</h4>
  <h5>五级标题</h5>
  <h6>六级标题（最小）</h6>
</body>
</html>
