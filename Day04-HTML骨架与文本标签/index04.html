<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本格式化标签和注释</title>
</head>
<body>
  <!--
  **记忆**:带语义的(`<strong>`、`<em>`、`<del>`)优先用,搜索引擎能识别
-->

<p><b>这是一个加粗的段落</b>(不带语义)</p>
<p><strong>加粗文本（强调，SEO权重高，推荐使用）</strong></p>
<p><i>斜体</i>（不带语义）</p>
<p><em>斜体文本（强调，SEO权重高，推荐使用）</em></p>
<p><u>下划线</u></p>
<p><s>删除线</s>(不带语义)</p>
<p><del>删除线（SEO权重高，推荐使用）</del></p>
<p><mark>高亮文字</mark></p>
<p>x<sup>2</sup>(上标，如平方)</p>
<p>H<sub>2</sub>(下标，如分子)</p>

<!-- 这是注释，浏览器不显示，但代码里能看到 -->
<!-- 注释用来描述代码，方便阅读和理解。 -->
<!-- **快捷键**:`Ctrl+/` 自动添加/取消注释 -->
</body>
</html>
